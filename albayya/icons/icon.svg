<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="البياع: بائع يناول مشترية كيساً وهي تدفع له">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f9cf63"/><stop offset="1" stop-color="#ef9f3a"/>
    </linearGradient>
    <linearGradient id="robe" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6aaaf0"/><stop offset="1" stop-color="#3a7fd6"/>
    </linearGradient>
    <linearGradient id="melhfa" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d9416f"/><stop offset="1" stop-color="#ad2552"/>
    </linearGradient>
    <linearGradient id="wood" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#a8642d"/><stop offset="1" stop-color="#7d4520"/>
    </linearGradient>
    <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="6" cy="6" r="3" fill="#ffd1df" opacity=".75"/><circle cx="17" cy="17" r="2.2" fill="#ffd45a" opacity=".8"/>
    </pattern>
    <clipPath id="tile"><rect width="512" height="512" rx="112"/></clipPath>
  </defs>
  <g clip-path="url(#tile)">
    <rect width="512" height="512" fill="url(#sky)"/>
    <path d="M0 330 Q120 290 250 325 T512 315 V512 H0Z" fill="#e88d2f" opacity=".5"/>
    <!-- stall poles -->
    <rect x="40" y="120" width="14" height="300" rx="6" fill="#6e3b18"/>
    <rect x="458" y="120" width="14" height="300" rx="6" fill="#6e3b18"/>

    <!-- BUYER (left): woman in a melhfa, handing over money -->
    <g>
      <path d="M104 214 Q150 186 196 214 L232 420 H70 Z" fill="url(#melhfa)"/>
      <path d="M104 214 Q150 186 196 214 L232 420 H70 Z" fill="url(#dots)"/>
      <!-- arm reaching to the seller -->
      <path d="M178 262 Q210 246 236 244 L240 268 Q212 274 188 292 Z" fill="#c2345f"/>
      <circle cx="242" cy="254" r="14" fill="#e9b58d"/>
      <!-- banknotes -->
      <g transform="rotate(-14 246 236)">
        <rect x="222" y="222" width="50" height="28" rx="4" fill="#1f8a4c"/>
        <rect x="228" y="214" width="50" height="28" rx="4" fill="#2fae66"/>
        <circle cx="253" cy="228" r="7" fill="none" stroke="#c9f2d9" stroke-width="3"/>
        <path d="M233 220 h8 M265 236 h8" stroke="#c9f2d9" stroke-width="3" stroke-linecap="round"/>
      </g>
      <circle cx="238" cy="246" r="7" fill="#e9b58d"/>
      <!-- face and melhfa hood -->
      <ellipse cx="150" cy="208" rx="30" ry="34" fill="#e9b58d"/>
      <path fill-rule="evenodd" fill="url(#melhfa)" d="M150 154 C196 154 206 196 202 236 L196 252 Q150 262 104 252 L98 236 C94 196 104 154 150 154 Z M150 176 C130 176 120 192 120 210 C120 230 132 244 150 244 C168 244 180 230 180 210 C180 192 170 176 150 176 Z"/>
      <path d="M118 168 Q150 150 182 168" fill="none" stroke="#ffd45a" stroke-width="4" stroke-linecap="round" opacity=".8"/>
      <ellipse cx="139" cy="208" rx="4.5" ry="5" fill="#2a1a10"/>
      <ellipse cx="161" cy="208" rx="4.5" ry="5" fill="#2a1a10"/>
      <path d="M140 226 Q150 234 160 226" fill="none" stroke="#9b4a35" stroke-width="4" stroke-linecap="round"/>
      <circle cx="131" cy="220" r="5" fill="#f0957f" opacity=".5"/><circle cx="169" cy="220" r="5" fill="#f0957f" opacity=".5"/>
    </g>

    <!-- SELLER (right): man in a blue daraa and indigo litham, handing over a bag -->
    <g>
      <path d="M332 250 Q368 240 404 250 L452 420 H284 Z" fill="url(#robe)"/>
      <path d="M318 300 Q306 360 300 420 M424 300 Q434 360 440 420" fill="none" stroke="#2c69b8" stroke-width="4" stroke-linecap="round" opacity=".7"/>
      <!-- arm reaching to the buyer -->
      <path d="M344 258 Q312 252 290 256 L288 282 Q314 284 336 296 Z" fill="#4a8de0"/>
      <!-- shopping bag -->
      <path d="M266 290 Q268 268 282 268 Q296 268 298 290" fill="none" stroke="#7a4a1e" stroke-width="5"/>
      <path d="M256 288 H308 L314 350 H250 Z" fill="#f4dcae"/>
      <path d="M256 288 H308 L309 300 H255 Z" fill="#0b8a4f"/>
      <circle cx="282" cy="324" r="10" fill="#c8323a"/>
      <circle cx="284" cy="270" r="13" fill="#edc29a"/>
      <!-- daraa neck and embroidery -->
      <path d="M350 250 L368 282 L386 250 Z" fill="#f4f7fb"/>
      <path d="M346 250 L368 288 L390 250" fill="none" stroke="#f2c230" stroke-width="5" stroke-linejoin="round"/>
      <path d="M380 296 H408 V322 Q394 332 380 322 Z" fill="none" stroke="#f2c230" stroke-width="4" stroke-linejoin="round"/>
      <!-- head, eyes, litham, turban -->
      <circle cx="368" cy="208" r="36" fill="#edc29a"/>
      <path d="M348 198 Q355 193 362 197 M374 197 Q381 193 388 198" fill="none" stroke="#5a3a22" stroke-width="3.5" stroke-linecap="round"/>
      <ellipse cx="355" cy="206" rx="4.5" ry="4" fill="#2a1a10"/>
      <ellipse cx="381" cy="206" rx="4.5" ry="4" fill="#2a1a10"/>
      <path d="M326 212 Q368 224 410 212 L414 240 Q410 268 368 272 Q326 268 322 240 Z" fill="#1f2b6b"/>
      <path d="M326 228 Q368 242 410 226 M326 246 Q368 262 412 244" fill="none" stroke="#33449a" stroke-width="4" stroke-linecap="round"/>
      <path d="M326 212 Q368 224 410 212" fill="none" stroke="#141c4a" stroke-width="4" stroke-linecap="round"/>
      <path d="M404 232 Q418 268 424 298 Q428 322 414 338 L396 326 Q406 310 400 290 Q394 266 392 246 Z" fill="#1f2b6b"/>
      <path d="M328 198 Q324 146 368 140 Q414 146 408 198 Q392 188 368 188 Q344 188 328 198Z" fill="#1f2b6b"/>
      <path d="M332 172 Q368 152 404 168 M330 186 Q366 166 408 184" fill="none" stroke="#33449a" stroke-width="5" stroke-linecap="round"/>
      <path d="M328 196 Q368 184 408 196" fill="none" stroke="#141c4a" stroke-width="4" stroke-linecap="round"/>
    </g>

    <!-- awning -->
    <path d="M28 92 H484 V150 Q455 176 427 150 Q399 176 370 150 Q342 176 313 150 Q285 176 256 150 Q228 176 199 150 Q171 176 142 150 Q114 176 85 150 Q57 176 28 150 Z" fill="#fff3d6"/>
    <path d="M85 92 H142 V150 Q114 176 85 150Z M199 92 H256 V150 Q228 176 199 150Z M313 92 H370 V150 Q342 176 313 150Z M427 92 H484 V150 Q455 176 427 150Z" fill="#0b8a4f"/>
    <rect x="22" y="80" width="468" height="18" rx="9" fill="#c8323a"/>
    <!-- goods and counter -->
    <ellipse cx="96" cy="388" rx="40" ry="28" fill="#2f8f3a"/>
    <path d="M62 378 Q96 360 130 378 M60 396 Q96 380 132 396" fill="none" stroke="#1d6b26" stroke-width="5"/>
    <circle cx="402" cy="388" r="15" fill="#f28a1c"/><circle cx="428" cy="386" r="15" fill="#f59a26"/><circle cx="415" cy="366" r="14" fill="#f7a836"/>
    <rect x="30" y="398" width="452" height="28" rx="8" fill="#b9733a"/>
    <rect x="46" y="422" width="420" height="120" fill="url(#wood)"/>
    <path d="M46 456 H466 M46 490 H466" stroke="#6e3b18" stroke-width="5"/>
  </g>
</svg>
