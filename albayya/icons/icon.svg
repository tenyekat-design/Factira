<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="البياع: بائع موريتاني في السوق">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f9cf63"/><stop offset="1" stop-color="#ef9f3a"/>
    </linearGradient>
    <linearGradient id="robe" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6aaaf0"/><stop offset="1" stop-color="#3a7fd6"/>
    </linearGradient>
    <linearGradient id="wood" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#a8642d"/><stop offset="1" stop-color="#7d4520"/>
    </linearGradient>
    <clipPath id="tile"><rect width="512" height="512" rx="112"/></clipPath>
  </defs>
  <g clip-path="url(#tile)">
    <rect width="512" height="512" fill="url(#sky)"/>
    <circle cx="104" cy="236" r="62" fill="#fde39a" opacity=".55"/>
    <!-- dunes -->
    <path d="M0 330 Q120 290 250 325 T512 315 V512 H0Z" fill="#e88d2f" opacity=".55"/>
    <!-- stall poles -->
    <rect x="62" y="120" width="16" height="300" rx="6" fill="#6e3b18"/>
    <rect x="434" y="120" width="16" height="300" rx="6" fill="#6e3b18"/>
    <!-- seller -->
    <g>
      <!-- daraa: wide robe hanging from the shoulders, its right side lifted by the raised arm -->
      <path d="M228 256 Q188 260 166 286 L92 404 H428 L404 236 Q372 252 334 268 Q306 258 284 256 Z" fill="url(#robe)"/>
      <path d="M166 286 Q150 340 140 404 M196 290 Q186 350 184 404 M330 280 Q352 330 372 404 M372 262 Q392 320 412 404" fill="none" stroke="#2c69b8" stroke-width="4" stroke-linecap="round" opacity=".7"/>
      <!-- forearm and open hand -->
      <path d="M368 238 L380 200 L398 206 L390 244 Z" fill="#edc29a"/>
      <path d="M362 246 Q384 226 404 236 L400 254 Q384 248 368 258 Z" fill="#f4f7fb"/>
      <ellipse cx="389" cy="196" rx="17" ry="19" fill="#edc29a"/>
      <rect x="369" y="170" width="8" height="22" rx="4" fill="#edc29a"/>
      <rect x="378" y="160" width="8" height="28" rx="4" fill="#edc29a"/>
      <rect x="387" y="158" width="8" height="30" rx="4" fill="#edc29a"/>
      <rect x="396" y="163" width="8" height="26" rx="4" fill="#edc29a"/>
      <rect x="403" y="187" width="8" height="20" rx="4" transform="rotate(-35 407 197)" fill="#edc29a"/>
      <!-- white undershirt at the neck and gold embroidery -->
      <path d="M234 256 L256 298 L278 256 Z" fill="#f4f7fb"/>
      <path d="M230 256 L256 304 L282 256" fill="none" stroke="#f2c230" stroke-width="5" stroke-linejoin="round"/>
      <path d="M256 304 V350" stroke="#f2c230" stroke-width="4" stroke-linecap="round" stroke-dasharray="2 7"/>
      <path d="M276 306 H312 V338 Q294 350 276 338 Z" fill="none" stroke="#f2c230" stroke-width="4.5" stroke-linejoin="round"/>
      <path d="M284 318 H304 M284 328 H304" stroke="#f2c230" stroke-width="3.5" stroke-linecap="round"/>
      <!-- head -->
      <circle cx="256" cy="210" r="40" fill="#edc29a"/>
      <!-- eyes and brows in the gap of the litham -->
      <path d="M233 200 Q241 195 249 199 M263 199 Q271 195 279 200" fill="none" stroke="#5a3a22" stroke-width="3.5" stroke-linecap="round"/>
      <ellipse cx="241" cy="208" rx="4.5" ry="4" fill="#2a1a10"/>
      <ellipse cx="271" cy="208" rx="4.5" ry="4" fill="#2a1a10"/>
      <!-- litham: indigo hawli covering nose, mouth and neck -->
      <path d="M210 214 Q256 226 302 214 L308 246 Q304 276 256 280 Q208 276 204 246 Z" fill="#1f2b6b"/>
      <path d="M210 230 Q256 246 304 228 M208 248 Q256 266 306 246 M226 270 Q258 262 292 268" fill="none" stroke="#33449a" stroke-width="4" stroke-linecap="round"/>
      <path d="M210 214 Q256 226 302 214" fill="none" stroke="#141c4a" stroke-width="4" stroke-linecap="round"/>
      <!-- tail of the hawli over the left shoulder -->
      <path d="M212 236 Q198 270 186 300 Q178 326 190 344 L212 336 Q204 318 212 296 Q222 268 228 250 Z" fill="#1f2b6b"/>
      <path d="M200 280 Q196 310 200 336" fill="none" stroke="#33449a" stroke-width="3.5" stroke-linecap="round"/>
      <!-- turban wraps -->
      <path d="M212 200 Q208 144 256 138 Q306 144 300 200 Q282 190 256 190 Q230 190 212 200Z" fill="#1f2b6b"/>
      <path d="M216 172 Q256 150 298 168 M214 186 Q252 164 300 184" fill="none" stroke="#33449a" stroke-width="5" stroke-linecap="round"/>
      <path d="M212 198 Q256 186 300 198" fill="none" stroke="#141c4a" stroke-width="4" stroke-linecap="round"/>
    </g>
    <!-- awning -->
    <path d="M40 92 H472 V150 Q445 176 418 150 Q391 176 364 150 Q337 176 310 150 Q283 176 256 150 Q229 176 202 150 Q175 176 148 150 Q121 176 94 150 Q67 176 40 150 Z" fill="#fff3d6"/>
    <path d="M94 92 H148 V150 Q121 176 94 150Z M202 92 H256 V150 Q229 176 202 150Z M310 92 H364 V150 Q337 176 310 150Z M418 92 H472 V150 Q445 176 418 150Z" fill="#0b8a4f"/>
    <rect x="34" y="80" width="444" height="18" rx="9" fill="#c8323a"/>
    <!-- goods on counter -->
    <ellipse cx="128" cy="374" rx="46" ry="34" fill="#2f8f3a"/>
    <path d="M90 360 Q128 340 166 360" fill="none" stroke="#1d6b26" stroke-width="6"/>
    <path d="M86 382 Q128 362 170 382" fill="none" stroke="#1d6b26" stroke-width="6"/>
    <circle cx="198" cy="384" r="18" fill="#f28a1c"/>
    <circle cx="226" cy="380" r="18" fill="#f59a26"/>
    <circle cx="212" cy="360" r="17" fill="#f7a836"/>
    <!-- teapot -->
    <path d="M298 392 Q294 352 324 348 Q354 352 350 392Z" fill="#cfd6df"/>
    <path d="M350 372 Q376 360 384 340" fill="none" stroke="#cfd6df" stroke-width="9" stroke-linecap="round"/>
    <path d="M300 360 Q284 366 290 384" fill="none" stroke="#aab4c0" stroke-width="7" stroke-linecap="round"/>
    <path d="M310 350 Q324 330 338 350Z" fill="#aab4c0"/>
    <circle cx="324" cy="332" r="6" fill="#aab4c0"/>
    <!-- dates basket -->
    <path d="M370 374 H440 L430 398 H380Z" fill="#c9893d"/>
    <ellipse cx="389" cy="370" rx="9" ry="7" fill="#6b2e14"/>
    <ellipse cx="405" cy="366" rx="9" ry="7" fill="#7a3518"/>
    <ellipse cx="421" cy="370" rx="9" ry="7" fill="#6b2e14"/>
    <!-- counter -->
    <rect x="46" y="394" width="420" height="30" rx="8" fill="#b9733a"/>
    <rect x="62" y="420" width="388" height="120" fill="url(#wood)"/>
    <path d="M62 452 H450 M62 486 H450" stroke="#6e3b18" stroke-width="5"/>
  </g>
</svg>
